name: Check Markdown links

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          use-quiet-mode: 'yes'
          config-file: 'mlc_config.json'
